# ImageNet classification with 2:4 magnitude sparsification only.
#
#   cks-opt cnn --config recipes/cnn/base_sparse_cls.yaml
#
# Remove the `quant` section to run sparsification without quantization.
model_name: resnet50
pretrained: false
dataset_root: datasets/imagenet
task: classification
input_shape: [1, 3, 224, 224]

sparsity:
  mode: sparse_magnitude
  sparsity: 0.5

calibration:
  num_samples: 32
  batch_size: 1
  split: train

evaluation_split: val

export:
  output_path: tmp/resnet50_imagenet.sparse.onnx
  opset_version: 17
