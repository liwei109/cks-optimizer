# Base image-classification recipe, using ResNet-50 + ImageNet as the example.
#
#   cks-opt cnn --config recipes/cnn/base_cls.yaml
#
# ImageNet layout: train/<synset>/* and official flat val images + ground-truth labels.
task: classification

model:
  name: resnet50
  pretrained: true
  input_shape: [1, 3, 224, 224]

data:
  root: datasets/imagenet
  calibration:
    split: train
    num_samples: 128
    batch_size: 8
  evaluation:
    split: val

optimize:
  quantization:
    mode: int8
    weights:
      bits: 8
      scheme: symmetric
      granularity: per_channel
    activations:
      bits: 8
      scheme: symmetric
      granularity: per_tensor

export:
  output_path: tmp/resnet50.int8.onnx
  opset_version: 17
