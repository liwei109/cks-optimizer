# Base image-classification recipe, using ResNet-50 + ImageNet as the example.
#
#   cks-opt cnn --config recipes/cnn/base_cls.yaml
#
# ImageNet layout: train/<synset>/* and official flat val images + ground-truth labels.
model_name: resnet50
pretrained: true
dataset_root: datasets/imagenet
task: classification
input_shape: [1, 3, 224, 224]

quant:
  mode: int8

calibration:
  num_samples: 128
  batch_size: 8
  split: train

evaluation_split: val

export:
  output_path: tmp/resnet50_imagenet.int8.onnx
  opset_version: 17
