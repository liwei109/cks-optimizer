[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cks-optimizer"
version = "0.1.0"
description = "CKS model optimizer for CNN and LM."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Li Wei", email = "liwei.109@outlook.com" }]
license = { text = "Apache-2.0" }
keywords = ["modelopt", "llmcompressor", "quantization", "onnx", "cnn", "large-model"]
dependencies = [
  "torch",
  "torchvision",
  "onnx",
  "onnxruntime",
  "onnxsim",
  "numpy",
  "Pillow",
  "PyYAML",
  "timm",
  "torchmetrics",
  "tqdm",
  "pycocotools"
]

[project.optional-dependencies]
coco = ["pycocotools"]

[project.scripts]
cks-opt = "cks_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cks_optimizer*"]
